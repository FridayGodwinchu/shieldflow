name: ShieldFlow Security Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:

  sast-semgrep:
    name: SAST - Semgrep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: p/owasp-top-ten
        continue-on-error: true

  secrets-gitleaks:
    name: Secrets - Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  dependency-trivy:
    name: Dependencies - Trivy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
        continue-on-error: true
      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
        continue-on-error: true

  dast-zap:
    name: DAST - OWASP ZAP
    runs-on: ubuntu-latest
    steps:
      - name: Start Juice Shop
        run: docker run -d -p 3000:3000 bkimminich/juice-shop
      - name: Wait for Juice Shop to be ready
        run: |
          echo "Waiting for Juice Shop..."
          for i in {1..60}; do
            if curl -s --max-time 5 http://localhost:3000 > /dev/null 2>&1; then
              echo "Juice Shop is up after $i attempts"
              break
            fi
            sleep 5
          done
      - name: Run ZAP baseline scan
        run: |
          docker run --rm --network host \
            -v $(pwd):/zap/wrk/:rw \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t http://localhost:3000 \
            -r zap-report.html \
            -I
        continue-on-error: true
      - name: Upload ZAP report
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: zap-report.html
        continue-on-error: true
  gate-check:
    name: Severity Gate
    runs-on: ubuntu-latest
    needs: [sast-semgrep, secrets-gitleaks, dependency-trivy]
    steps:
      - uses: actions/checkout@v4

      - name: Install Trivy for gate check
        run: |
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
          echo "deb https://aquasecurity.github.io/trivy-repo/deb generic main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update && sudo apt-get install -y trivy

      - name: Fail on CRITICAL findings
        run: |
          trivy fs . --exit-code 1 --severity CRITICAL --quiet
          echo "No critical vulnerabilities found. Proceeding."
  notify-soar:
    name: Send findings to SOAR
    runs-on: ubuntu-latest
    needs: [sast-semgrep, secrets-gitleaks, dependency-trivy, gate-check]
    if: always()
    steps:
      - name: POST findings to Shuffle SOAR
        run: |
          if [ -z "${{ secrets.SOAR_WEBHOOK_URL }}" ]; then
            echo "SOAR_WEBHOOK_URL not set yet - skipping notification"
            exit 0
          fi
          curl -X POST "${{ secrets.SOAR_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{
              "source": "github-actions",
              "repo": "${{ github.repository }}",
              "commit": "${{ github.sha }}",
              "branch": "${{ github.ref_name }}",
              "triggered_by": "${{ github.actor }}",
              "timestamp": "${{ github.event.head_commit.timestamp }}",
              "pipeline_status": "${{ job.status }}"
            }'
        continue-on-error: true
