name: ShieldFlow Security Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:

  sast-semgrep:
    name: SAST - Semgrep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: p/owasp-top-ten
        continue-on-error: true

  secrets-gitleaks:
    name: Secrets - Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  dependency-trivy:
    name: Dependencies - Trivy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
        continue-on-error: true
      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
        continue-on-error: true

  dast-zap:
    name: DAST - OWASP ZAP
    runs-on: ubuntu-latest
    steps:
      - name: Start Juice Shop
        run: docker run -d -p 3000:3000 bkimminich/juice-shop
      - name: Wait for app to start
        run: sleep 20
      - name: Run OWASP ZAP scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: http://localhost:3000
          fail_action: false

  gate-check:
    name: Severity Gate
    runs-on: ubuntu-latest
    needs: [sast-semgrep, secrets-gitleaks, dependency-trivy]
    steps:
      - name: Gate passed
        run: echo "All scans completed. Review findings before deploying."
